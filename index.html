<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reporter</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="wrap">
  <section id="editor">
    <h1>Images to PDF</h1>
    <p class="sub">Group images into activities. Each activity gets a title page, then its images.</p>
    <div class="cover-details">
      <h2>Cover page</h2>
      <div class="cover-fields">
        <label>Student name
          <div class="saved-input">
            <input id="studentName" type="text" list="studentNameList" placeholder="Enter student name">
            <button type="button" data-save-field="studentName" title="Save student name">Save</button>
          </div>
        </label>
        <datalist id="studentNameList"></datalist>
        <label>Student group
          <div class="saved-input">
            <input id="studentGroup" type="text" list="studentGroupList" placeholder="Enter group">
            <button type="button" data-save-field="studentGroup" title="Save student group">Save</button>
          </div>
        </label>
        <datalist id="studentGroupList"></datalist>
        <label>Course name
          <div class="saved-input">
            <input id="courseName" type="text" list="courseNameList" placeholder="Enter course name">
            <button type="button" data-save-field="courseName" title="Save course name">Save</button>
          </div>
        </label>
        <datalist id="courseNameList"></datalist>
        <label>Unit<input id="unitName" type="text" placeholder="Enter unit"></label>
        <label>Title<input id="coverTitle" type="text" placeholder="Enter report title"></label>
        <label>Teacher name
          <div class="teacher-input">
            <input id="teacherName" type="text" list="teacherList" placeholder="Enter teacher name">
            <button type="button" data-save-field="teacherName" title="Save teacher">Save</button>
          </div>
        </label>
        <datalist id="teacherList"></datalist>
        <label>Date<input id="coverDate" type="date"></label>
      </div>
      <div class="cover-design-wrap">
        <span class="design-label">Choose a cover design</span>
        <div class="cover-design-options" id="coverDesignOptions"></div>
      </div>
    </div>
    <div id="activities"></div>
    <button class="add-activity" id="addActivity">+ Add activity</button>
    <div class="actions">
      <button id="generate">Generate PDF</button>
      <span id="status"></span>
    </div>
  </section>
  <section id="preview" hidden>
    <div class="preview-head">
      <div>
        <h2>Preview your PDF</h2>
        <p class="sub">Review the layout before downloading your finished report.</p>
      </div>
      <div class="preview-actions">
        <label class="filename-field" for="pdfName">
          File name
          <input id="pdfName" type="text" value="activities" spellcheck="false">
        </label>
        <button id="backToEdit">Back to edit</button>
        <button id="download">Download PDF</button>
      </div>
    </div>
    <iframe class="preview-frame" id="previewFrame" title="PDF preview"></iframe>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
